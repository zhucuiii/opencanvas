services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: opencanvas:local
    container_name: opencanvas
    ports:
      - "127.0.0.1:10086:3000"
    restart: unless-stopped
    # 统计分析（可选，默认关闭）。每家一个独立变量，填了谁就启用谁，可同时启用多家：
    # environment:
    #   ANALYTICS_GA4_ID: G-XXXXXXXXXX                    # Google Analytics 4 衡量 ID
    #   ANALYTICS_BAIDU_ID: xxxxxxxxxxxxxxxxxxxxxxxxxxxx   # 百度统计站点 ID

  app-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: opencanvas:local
    container_name: opencanvas-test
    ports:
      - "127.0.0.1:10087:3000"
    restart: unless-stopped
