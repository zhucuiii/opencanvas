server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Front-end routes must fall back to index.html. Do not use $uri/ here:
        # /assets would otherwise resolve to the Vite static directory and nginx
        # would return a 403 directory-index error instead of booting the SPA.
        try_files $uri /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
